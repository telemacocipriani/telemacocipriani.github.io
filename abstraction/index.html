<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ONE — a ladder of abstraction</title>
<meta name="description" content="From ONE, downward: a vertical tree of words that splits from unity into dichotomy, language, and the concrete world. Drag, scroll, pinch to roam.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  :root{
    --void:#050507; --bone:#f4f1e8; --dim:#3a3a46;
    --c-root:#ffffff;
    --c-sign:#ff1f6b;      /* hot magenta */
    --c-meaning:#25ffb0;   /* acid green */
    --c-sound:#ffd200;     /* electric yellow */
    --c-mark:#3d7bff;      /* voltage blue */
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:var(--void); color:var(--bone);
    font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;}
  /* the boundless field you drag through */
  #field{position:fixed; inset:0; cursor:grab; touch-action:none;
    background-color:var(--void);
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
    background-size:52px 52px;}
  #field.drag{cursor:grabbing}
  /* vignette */
  #field::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 38%, transparent 34%, rgba(0,0,0,.82) 100%);}
  /* scanlines — the edgy overlay */
  #scan{position:fixed; inset:0; pointer-events:none; z-index:3; mix-blend-mode:overlay; opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);}
  /* the transformed stage that actually holds the tree */
  #stage{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;}
  #wires{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}
  #wires .spine{stroke:var(--bone); stroke-width:2.2; stroke-opacity:.6; fill:none;
    stroke-dasharray:5 8; animation:flow 1.1s linear infinite; filter:drop-shadow(0 0 6px rgba(244,241,232,.5));}
  @keyframes flow{to{stroke-dashoffset:-26}}
  .node{position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
    pointer-events:auto; cursor:default; line-height:1; user-select:none;
    transition:opacity .3s, filter .3s;}
  .node .w{display:inline-block}
  /* abstract tiers: display serif, shouted */
  .node.tier0 .w,.node.tier1 .w,.node.tier2 .w{
    font-family:"Times New Roman",Georgia,serif; text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  /* concrete tiers: lowercase machine type */
  .node.tier3 .w,.node.tier4 .w{ text-transform:lowercase; letter-spacing:.02em;}
  .node:hover{filter:brightness(1.4)}
  /* the root breathes */
  @keyframes breathe{0%,100%{filter:brightness(.92)} 50%{filter:brightness(1.45)}}
  .node.tier0 .w{animation:breathe 3.6s ease-in-out infinite;}
  .node .tag{display:block; font-family:"SF Mono",ui-monospace,monospace; text-transform:uppercase;
    font-size:9px; letter-spacing:.3em; opacity:.34; margin-bottom:6px; font-weight:400;}
  /* fixed chrome */
  .hud{position:fixed; pointer-events:none; z-index:5; color:var(--bone);
    font-size:10px; letter-spacing:.36em; text-transform:uppercase; opacity:.5;}
  #axisTop{top:16px; left:50%; transform:translateX(-50%);}
  #axisBot{bottom:16px; left:50%; transform:translateX(-50%);}
  #title{top:16px; left:18px; max-width:250px; letter-spacing:.3em; opacity:.66; line-height:1.95;}
  #title b{display:block; font-size:16px; letter-spacing:.42em; color:#fff; opacity:1}
  #title .sub{opacity:.5; font-size:9px}
  #hint{bottom:16px; left:18px; opacity:.4}
  #back{top:16px; right:18px; pointer-events:auto; text-decoration:none; color:var(--bone);
    opacity:.5; font-size:10px; letter-spacing:.28em; text-transform:uppercase; border:1px solid var(--dim);
    padding:7px 11px; border-radius:2px; transition:.2s}
  #back:hover{opacity:1; border-color:var(--bone)}
  #z{position:fixed; bottom:16px; right:18px; z-index:5; display:flex; gap:8px}
  #z button{width:34px; height:34px; background:transparent; color:var(--bone); border:1px solid var(--dim);
    font:inherit; font-size:16px; cursor:pointer; border-radius:2px; opacity:.6; transition:.2s}
  #z button:hover{opacity:1; border-color:var(--bone)}
  @media (max-width:640px){ #title{display:none} .node .tag{display:none} }
</style>
</head>
<body>
<div id="field">
  <div id="stage">
    <svg id="wires"></svg>
  </div>
</div>
<div id="scan"></div>

<div class="hud" id="title"><b>ONE</b><span class="sub">from unity, downward —<br>dichotomy · language · world</span></div>
<div class="hud" id="axisTop">▲ more abstract</div>
<div class="hud" id="axisBot">more concrete ▼</div>
<div class="hud" id="hint">drag · scroll · pinch to zoom</div>
<a id="back" href="../">← telemaco</a>
<div id="z"><button id="zout" aria-label="zoom out">−</button><button id="zin" aria-label="zoom in">+</button></div>

<script>
/* ---------- the tree: a single stalk descending from unity, then splitting into the world ---------- */
/* Spine (One → Dichotomy → Language) named by Andrea. Everything below is the descent into the concrete. */
const TREE = { w:'One', c:[
  { w:'Dichotomy', c:[
    { w:'Language', c:[
      { w:'Sign', c:[
        { w:'Word', c:[ {w:'noun'},{w:'verb'},{w:'name'} ] },
        { w:'Symbol', c:[ {w:'letter'},{w:'number'},{w:'glyph'} ] },
      ]},
      { w:'Meaning', c:[
        { w:'Concept', c:[ {w:'time'},{w:'self'},{w:'truth'} ] },
        { w:'Feeling', c:[ {w:'joy'},{w:'fear'},{w:'longing'} ] },
      ]},
      { w:'Sound', c:[
        { w:'Voice', c:[ {w:'vowel'},{w:'consonant'} ] },
        { w:'Song', c:[ {w:'note'},{w:'rhythm'},{w:'silence'} ] },
      ]},
      { w:'Mark', c:[
        { w:'Writing', c:[ {w:'alphabet'},{w:'ink'} ] },
        { w:'Code', c:[ {w:'binary'},{w:'cipher'} ] },
      ]},
    ]},
  ]},
]};

/* accent is decided by the family node (the children of Language, at depth 3) */
const BRANCH = { Sign:'--c-sign', Meaning:'--c-meaning', Sound:'--c-sound', Mark:'--c-mark' };
const ACCENT_DEPTH = 3;

/* ---------- layout: leaves get sequential columns, parents center over children ---------- */
const COLW = 150, ROWH = 234;   /* taller: the ladder stretches vertically */
let nodes=[], edges=[], leaf=0, maxDepth=0;
function walk(n, parent, depth, branch){
  n.depth=depth; n.parent=parent||null;
  n.branch = depth===ACCENT_DEPTH ? n.w : (depth>ACCENT_DEPTH ? branch : null);
  maxDepth=Math.max(maxDepth,depth);
  nodes.push(n);
  if(parent) edges.push([parent,n]);
  if(n.c && n.c.length){
    n.c.forEach(ch=>walk(ch,n,depth+1,n.branch));
    n.x = (n.c[0].x + n.c[n.c.length-1].x)/2;
  } else { n.x = leaf++; }
}
walk(TREE,null,0,null);

const css = getComputedStyle(document.documentElement);
function color(n){ return n.branch && BRANCH[n.branch] ? css.getPropertyValue(BRANCH[n.branch]).trim() : css.getPropertyValue('--c-root').trim(); }
function px(n){ return { x:n.x*COLW, y:n.depth*ROWH }; }

const stage=document.getElementById('stage'), wires=document.getElementById('wires');

/* edges — spine gets a bright animated plumb line; branches are hair-thin neon curves */
let paths='';
edges.forEach(([p,c])=>{
  const a=px(p), b=px(c), my=(a.y+b.y)/2;
  const d = `M${a.x} ${a.y+8} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y-8}`;
  if(c.depth<=2){ // the One → Dichotomy → Language spine
    paths += `<path class="spine" d="${d}"/>`;
  } else {
    paths += `<path d="${d}" fill="none" stroke="${color(c)}" stroke-width="1" stroke-opacity="${0.16+c.depth*0.06}"/>`;
  }
});
wires.innerHTML=paths;

/* nodes */
const SIZE=[78,52,39,27,18,13];   // font px by depth (abstract → concrete)
let minX=1e9,maxX=-1e9,maxY=0;
nodes.forEach(n=>{
  const p=px(n);
  minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
  const el=document.createElement('div');
  el.className='node tier'+Math.min(n.depth,4);
  el.style.left=p.x+'px'; el.style.top=p.y+'px';
  const size=SIZE[Math.min(n.depth,5)];
  const col=color(n);
  const tag = n.depth<=2 ? `<span class="tag">tier ${n.depth}</span>` : '';
  // spine nodes get a chromatic glow; the root gets a hard chromatic split
  let shadow;
  if(n.depth===0) shadow = `-3px 0 24px #ff1f6b88, 3px 0 24px #3d7bff88, 0 0 40px #ffffff66`;
  else if(n.depth<=2) shadow = `0 0 30px #ffffff55, 0 0 8px #ffffff88`;
  else shadow = `0 0 ${10}px ${col}22`;
  el.innerHTML = tag + `<span class="w" style="font-size:${size}px; color:${col}; `
    + `opacity:${n.depth<=1?0.95:1}; text-shadow:${shadow}">${n.w}</span>`;
  stage.appendChild(el);
});

/* size the svg so curves aren't clipped */
wires.setAttribute('width', (maxX-minX)+COLW);
wires.setAttribute('height', maxY+ROWH);

/* ---------- pan + zoom ---------- */
let tx=0, ty=0, s=1;
function apply(){ stage.style.transform=`translate(${tx}px,${ty}px) scale(${s})`; }
function center(){
  const vw=innerWidth, root=px(nodes[0]);
  s = vw<640 ? 0.58 : 0.82;
  tx = vw/2 - root.x*s;
  ty = 108;
  apply();
}
center();
addEventListener('resize', center);

const field=document.getElementById('field');
let dragging=false, lx=0, ly=0;
field.addEventListener('pointerdown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; field.classList.add('drag'); field.setPointerCapture(e.pointerId); });
field.addEventListener('pointermove', e=>{ if(!dragging) return; tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply(); });
addEventListener('pointerup', ()=>{ dragging=false; field.classList.remove('drag'); });

field.addEventListener('wheel', e=>{
  e.preventDefault();
  if(e.ctrlKey){ // trackpad pinch / ctrl-scroll → zoom about cursor
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY*0.01));
  } else {       // otherwise it's boundless scroll through the void
    tx-=e.deltaX; ty-=e.deltaY; apply();
  }
},{passive:false});

function zoomAt(cx,cy,factor){
  const ns=Math.min(2.4, Math.max(0.16, s*factor));
  tx = cx - (cx-tx)*(ns/s);
  ty = cy - (cy-ty)*(ns/s);
  s = ns; apply();
}
document.getElementById('zin').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.2);
document.getElementById('zout').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.2);
</script>
</body>
</html>
